apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: shared-pvc
      containers:
      - name: ping-pong
        image: quietmid/ping-pong:0.1.1
        env:
        - name: COUNT_FILE
          value: /data/count.txt
        volumeMounts:
        - name: shared-data
          mountPath: /data
        ports:
        - name: http
          containerPort: 3000