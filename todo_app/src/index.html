<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Todo App</title>
		<link rel="stylesheet" href="/styles.css">
	</head>
	<body>
		<h1>Todo App is running</h1>
		<img id="todo-image" src="/image" alt="Random landscape photo">
		<section aria-labelledby="add-todo-heading">
			<h2 id="add-todo-heading">Add a todo</h2>
			<form id="todo-form">
				<label for="todo-input"></label>
				<input
					id="todo-input"
					name="todo"
					type="text"
					placeholder="enter new todo task (max 140 characters)"
				>
				<button id="send-button" type="submit" disabled>Send</button>
			</form>
			<p id="new-task" aria-live="polite"></p>
		</section>

		<section aria-labelledby="existing-todos-heading">
			<h2 id="existing-todos-heading">Existing todos</h2>
			<ul id="todo-list"></ul>
		<h1>DevOps with Kubernete 2026</h1>
		</section>

		<script>
			const form = document.querySelector("#todo-form");
			const input = document.querySelector("#todo-input");
			const sendButton = document.querySelector("#send-button");
			const newTask = document.querySelector("#new-task");
			const todoList = document.querySelector("#todo-list");

			function renderTodos(todos) {
				todoList.replaceChildren(
					...todos.map((todo) => {
						const item = document.createElement("li");
						item.textContent = todo.text;
						return item;
					}),
				);
			}

			async function loadTodos() {
				const response = await fetch("/todos");
				if (!response.ok) {
					throw new Error(`GET /todos failed with ${response.status}`);
				}
				renderTodos(await response.json());
			}

			loadTodos().catch((error) => {
				newTask.textContent = "Could not load todos";
				console.error(error);
			});

			input.addEventListener("input", () => {
				sendButton.disabled = input.value.length === 0 || input.value.length > 140;
			});

			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				const task = input.value.trim();
				if (task.length === 0 || task.length > 140) {
					return;
				}

				try {
					const response = await fetch("/todos", {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify({ todo: task }),
					});
					if (!response.ok) {
						throw new Error(`POST /todos failed with ${response.status}`);
					}
					input.value = "";
					sendButton.disabled = true;
					newTask.textContent = "";
					await loadTodos();
				} catch (error) {
					newTask.textContent = "Could not save the todo";
					console.error(error);
				}
			});
		</script>
	</body>
</html>
