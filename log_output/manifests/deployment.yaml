apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: shared-pvc
      - name: log-file
        emptyDir: {}
      containers:
      - name: log-generator
        image: quietmid/log-generator:0.1.1
        env:
        - name: LOG_FILE
          value: /var/log/log-generator/output.log
        volumeMounts:
        - name: log-file
          mountPath: /var/log/log-generator
      - name: log-reader
        image: quietmid/log-reader:0.1.1
        env:
        - name: LOG_FILE
          value: /var/log/log-generator/output.log
        - name: COUNT_FILE
          value: /data/count.txt
        ports:
        - name: http
          containerPort: 3000
        volumeMounts:
        - name: log-file
          mountPath: /var/log/log-generator
        - name: shared-data
          mountPath: /data