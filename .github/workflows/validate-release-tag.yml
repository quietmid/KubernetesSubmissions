name: Validate release tag

on:
  release:
    types: [published, edited]

permissions: {}

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure tag matches exercise number
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid release tag: '$TAG_NAME'"
            echo "Tag must match the exercise number format, e.g. 1, 1.1, 2.5"
            exit 1
          fi
